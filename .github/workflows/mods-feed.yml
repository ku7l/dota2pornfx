name: mods-feed

on:
  schedule:
    - cron: "*/5 * * * *"- cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mods-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run bot
        run: python bot.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FORUM_THREAD_ID: "1571091937031888907"

      - name: Save state
        run: |
          git config user.name "mods-bot"
          git config user.email "mods-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
